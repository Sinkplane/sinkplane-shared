name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # Writes ~/.npmrc pointing at GitHub Packages using NODE_AUTH_TOKEN.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          registry-url: https://npm.pkg.github.com

      # All runtime dependencies are peer dependencies (resolved by the
      # consuming app); devDependencies exist only to typecheck and compile.
      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
