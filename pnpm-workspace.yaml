# pnpm settings for this package.
#
# There is no local install here by design: node_modules is a symlink to
# ../sinkplane-tv/node_modules (see README). Prevent pnpm from trying to
# re-install/verify dependencies before running scripts, and never
# auto-install peer dependencies — that would write into the consuming
# app's node_modules through the symlink.
verifyDepsBeforeRun: false
autoInstallPeers: false